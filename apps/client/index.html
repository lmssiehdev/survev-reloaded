<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta Properties -->
        <meta charset="UTF-8">
        <title>survev.io - 2d battle royale game</title>
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no"
        >
        <link rel="manifest" href="manifest.json">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="survev.io">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="application-name" content="survev.io">
        <meta
            name="description"
            content="Like games such as Player Unknown's Battlegrounds (PUBG), Fortnite or Apex Legends? Play this free 2d battle royale io game in your browser!"
        >
        <meta
            property="og:description"
            content="Like games such as Player Unknown's Battlegrounds (PUBG), Fortnite or Apex Legends? Play this free 2d battle royale io game in your browser!"
        >
        <meta
            name="keywords"
            content="survev, resurviv, survivio, surviv, 2d battle royale, io, battle royale browser game, 2d battlegrounds, battlegrounds, battleroyale, battle, royale, browser game, br, survival, game, web game, multiplayer"
        >
        <meta property="og:type" content="website">
        <meta property="og:title" content="survev.io">
        <meta property="og:url" content="https://survev.io/">
        <meta property="og:site_name" content="survev.io">
        <meta content="https://survev.io/img/survev_title.png" property="og:image">
        <link rel="canonical" href="https://survev.io" />
        <link rel="apple-touch-icon-precomposed" href="img/icon_app.png">
        <link rel="icon" href="favicon.ico" type="image/x-icon">

        <link rel="preload" href="/fonts/phantom-guardians-bold.otf" as="font" type="font/otf" crossorigin>
        <!-- Styles -->

        <link href="css/app.css" rel="stylesheet">
        <link href="css/game.css" rel="stylesheet">
    </head>
    <body>
        <div id="fb-root"></div>
        <canvas tabindex="1" id="cvs"></canvas>
        <div id="game-area-wrapper" style="display: none" oncontextmenu="return false">
            <div id="game-touch-area"></div>
            <!-- class select: src/ui/components/GameHud.tsx -->
            <div id="ui-role-menu-ui" style="display: contents" data-game-view></div>
            <div id="ui-game" class="click-through">
                <!-- in-game menu and big map close button: src/ui/components/GameMenu.tsx -->
                <div id="ui-game-menu-ui" style="display: contents" data-game-view></div>
                <!-- src/ui/components/EmoteWheel.tsx -->
                <div id="emote-wheels-ui" style="display: contents"></div>
                <div id="ui-team-indicators" class="js-ui-map-hidden js-desktop-ui-hud-show">
                    <div class="ui-team-indicator ui-indicator-main" data-id="0">
                        <div class="ui-team-indicator-pos ui-background-yellow"></div>
                    </div>
                    <div class="ui-team-indicator ui-indicator-main" data-id="1">
                        <div class="ui-team-indicator-pos ui-background-purple"></div>
                    </div>
                    <div class="ui-team-indicator ui-indicator-main" data-id="2">
                        <div class="ui-team-indicator-pos ui-background-cyan"></div>
                    </div>
                    <div class="ui-team-indicator ui-indicator-main" data-id="3">
                        <div class="ui-team-indicator-pos ui-background-orange"></div>
                    </div>
                    <div class="ui-team-indicator ui-indicator-main" data-id="4">
                        <div class="ui-team-indicator-pos ui-background-yellow"></div>
                    </div>
                    <div class="ui-team-indicator ui-indicator-ping" data-id="0">
                        <div class="ui-team-indicator-pos ui-team-indicator-image"></div>
                    </div>
                    <div class="ui-indicator-ping-border" data-id="0"></div>
                    <div class="ui-team-indicator ui-indicator-ping" data-id="1">
                        <div class="ui-team-indicator-pos ui-team-indicator-image"></div>
                    </div>
                    <div class="ui-indicator-ping-border" data-id="1"></div>
                    <div class="ui-team-indicator ui-indicator-ping" data-id="2">
                        <div class="ui-team-indicator-pos ui-team-indicator-image"></div>
                    </div>
                    <div class="ui-indicator-ping-border" data-id="2"></div>
                    <div class="ui-team-indicator ui-indicator-ping" data-id="3">
                        <div class="ui-team-indicator-pos ui-team-indicator-image"></div>
                    </div>
                    <div class="ui-indicator-ping-border" data-id="3"></div>
                    <div class="ui-team-indicator ui-indicator-ping" data-id="4">
                        <div class="ui-team-indicator-pos ui-team-indicator-image"></div>
                    </div>
                    <div class="ui-indicator-ping-border" data-id="4"></div>
                </div>
                <div id="ui-right-center" class="ui-right-center-desktop js-ui-map-hidden">
                    <div id="ui-hud-inventory-ui" style="display: contents"></div>
                    <!-- src/ui/components/EmoteWheel.tsx -->
                    <div id="emote-button-ui" style="display: contents"></div>
                </div>
                <!-- team panel: src/ui/components/GameHud.tsx -->
                <div id="ui-top-left-ui" style="display: contents" data-game-view></div>
                <!-- minimap controls and kill leader: src/ui/components/GameHud.tsx -->
                <div id="ui-map-ui" style="display: contents" data-game-view></div>
                <div id="ui-killfeed-wrapper">
                    <div id="ui-killfeed" class="js-ui-map-hidden js-ui-hud-show">
                        <div id="ui-hud-killfeed-ui" style="display: contents"></div>
                    </div>
                </div>
                <!-- alive / kill counters: src/ui/components/GameHud.tsx -->
                <div id="ui-leaderboard-ui" style="display: contents" data-game-view></div>
                <div id="ui-top-center-scopes-wrapper">
                    <div id="ui-hud-scopes-ui" style="display: contents"></div>
                </div>
                <!-- waiting / spectating text and announcements: src/ui/components/GameHud.tsx -->
                <div id="ui-top-center-ui" style="display: contents" data-game-view></div>
                <div id="ui-lower-center" class="js-ui-map-hidden js-ui-hud-show click-through">
                    <div id="ui-hud-interaction-ui" style="display: contents"></div>
                </div>
                <div id="ui-bottom-center-2" class="click-through">
                    <div id="ui-hud-messages-ui" style="display: contents"></div>
                </div>
                <div id="ui-equipped-ammo-wrapper" class="js-ui-map-hidden js-ui-hud-show">
                    <div id="ui-hud-ammo-ui" style="display: contents"></div>
                </div>
                <div id="ui-bottom-center-0" class="click-through js-ui-map-hidden js-ui-hud-show">
                    <div id="ui-hud-health-ui" style="display: contents"></div>
                </div>
                <div id="ui-bottom-center-left" class="js-ui-map-hidden">
                    <div id="ui-hud-perks-ui" style="display: contents"></div>
                </div>
                <div id="ui-bottom-center-right" class="js-ui-map-hidden">
                    <div id="ui-hud-gear-ui" style="display: contents"></div>
                </div>
                <div id="ui-bottom-right" class="js-ui-map-hidden">
                    <div id="ui-hud-weapons-ui" style="display: contents"></div>
                </div>
                <!-- spectate options: src/ui/components/GameHud.tsx -->
                <div id="ui-spectate-ui" style="display: contents" data-game-view></div>
                <div id="ui-bottom-center-1" class="click-through">
                    <div id="ui-hud-kills-ui" style="display: contents"></div>
                </div>
            </div>
            <!-- death / victory screen: src/ui/components/DeathScreen.tsx -->
            <div id="ui-stats-ui" style="display: contents" data-game-view></div>
            <!-- debug editor overlay: src/ui/components/DeathScreen.tsx -->
            <div id="ui-editor-ui" style="display: contents" data-game-view></div>
        </div>
        <div id="start-menu-wrapper">
            <div id="safari-margin"></div>
            <div id="background">
                <div id="start-overlay"></div>
            </div>
            <div id="start-main">
                <!-- src/ui/components/StartMenu.tsx -->
                <div id="start-top-left-ui" style="display: contents"></div>
                <!-- account modals and the top-right account corner: src/ui/components/Account.tsx -->
                <div id="account-ui" style="display: contents"></div>

                <div id="start-main-center-ui" style="display: contents"></div>

                <div id="start-bottom-ui" style="display: contents"></div>
            </div>
            <!-- Modals -->
            <!-- loadout / customize modal: src/ui/components/Loadout.tsx -->
            <div id="loadout-modal" style="display: contents"></div>
            <!--
                keybind, settings, hamburger, notification, update and ip ban modals: src/ui/components/AppModals.tsx
            -->
            <div id="app-modals" style="display: contents"></div>
            <!-- "new item" modal and its screen block: src/ui/components/Loadout.tsx -->
            <div id="loadout-item-confirm" style="display: contents"></div>
        </div>
        <script>
            // load a cached background image as earlier as possible
            // so we dont have to wait for API to reply to show a background
            const config = JSON.parse(localStorage.getItem("surviv_config") || "{}");
            const bgImg = config.cachedBgImg || "img/splashes/main.webp";
            const bg = document.getElementById("background");
            if (bg) {
                bg.style.backgroundImage = `url(${bgImg})`;
            }
        </script>
        <script type="module" src="src/main.ts"></script>
    </body>
</html>
