name: Server

on:
  push:
    branches:
      - master
    paths: &paths
      - "apps/api/**"
      - "apps/server/**"
      - "packages/**"
      - "scripts/**"
      - "*.json"
      - "bun.lock"
      - ".github/workflows/server.yml"

  pull_request:
    paths: *paths

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    concurrency: ci-server-${{ github.ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install Packages
        run: bun install --frozen-lockfile

      - name: Typecheck API
        run: bun run typecheck
        working-directory: ./apps/api

      - name: Typecheck Game Server
        run: bun run typecheck
        working-directory: ./apps/server

      - name: Typecheck Packages
        run: bun run --filter './packages/*' typecheck

      - name: Build API
        run: bun run build
        working-directory: ./apps/api

      - name: Build Game Server
        run: bun run build
        working-directory: ./apps/server
