name: Lint

on:
  push:
    branches:
      - master
    paths: &paths
      - "**.js"
      - "**.ts"
      - "**.json"
      - "**.css"
      - "**.yaml"
      - ".github/workflows/lint.yml"

  pull_request:
    paths: *paths

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency: ci-lint-${{ github.ref }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install Packages
        run: bun install --frozen-lockfile

      - name: Run bun lint
        run: bun lint --no-script --max-warnings 0

      - name: Run dprint
        if: always()
        run: bun x dprint check
