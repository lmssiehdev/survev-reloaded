name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# a new push replaces the running deploy, and closing the PR can't race one that would bring the preview back
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  WRANGLER: bunx wrangler@4.156.0

jobs:
  deploy:
    name: Deploy
    # forks don't get the Cloudflare secrets
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install Packages
        run: bun install --frozen-lockfile

      - name: Restore Atlas Cache
        uses: actions/cache@v5
        with:
          path: ./apps/client/node_modules/.atlas-cache/
          key: "atlas-cache-${{ github.run_id }}"
          restore-keys: |
            atlas-cache

      - name: Build Client
        run: bun run build
        working-directory: ./apps/client

      - name: Deploy Preview
        id: preview
        working-directory: ./apps/client
        run: |
          set -o pipefail
          output="$($WRANGLER preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URL
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview: $PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub closes the PR when its branch is deleted, so this covers merged, closed and deleted
  cleanup:
    name: Cleanup
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Delete Preview
        working-directory: ./apps/client
        run: $WRANGLER preview delete --name "$PREVIEW_NAME" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview Removed
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "Preview removed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
