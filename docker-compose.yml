# Production setup, see HOSTING.md. Settings come from .env (see .env.example), the values
# below are the ones this setup fixes (service addresses) or derives from the domains.
name: survev

x-build: &build
  context: .
  # the client bakes the public VITE_* variables in
  args:
    VITE_API_URL: ${VITE_API_URL:-}

services:
  web:
    build: { <<: *build, target: web }
    restart: unless-stopped
    depends_on: [api, game]
    environment:
      SURVEV_DOMAIN: ${SURVEV_DOMAIN:?set SURVEV_DOMAIN in .env}
      SURVEV_GAME_DOMAIN: ${SURVEV_GAME_DOMAIN:?set SURVEV_GAME_DOMAIN in .env}
      SURVEV_GAME_PORTS: ${SURVEV_GAME_PORTS:-9000-9063}
      SURVEV_SCHEME: ${SURVEV_SCHEME:-https}
      SURVEV_HTTP_PORT: ${SURVEV_HTTP_PORT:-80}
    ports:
      - "${SURVEV_HTTP_PORT:-80}:${SURVEV_HTTP_PORT:-80}"
      - "443:443"
      - "443:443/udp"
      - "${SURVEV_GAME_PORTS:-9000-9063}:${SURVEV_GAME_PORTS:-9000-9063}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # the API reaches the game server through its public region address, keep that inside the network
        aliases: ["${SURVEV_GAME_DOMAIN}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s

  api:
    build: { <<: *build, target: api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-survev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-survev}
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: ${SURVEV_SCHEME:-https}://${SURVEV_DOMAIN}
      # Caddy sets X-Forwarded-For to the client IP. Only the compose network can reach the servers directly.
      PROXY_IP_HEADER: X-Forwarded-For
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8000/api/site_info'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  game:
    build: { <<: *build, target: game }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    env_file: .env
    environment:
      API_URL: http://api:8000
      # set REGION_URL in .env when the game server isn't on the default port (local testing: http://<game domain>:8080)
      REGION_URL: ${REGION_URL:-${SURVEV_SCHEME:-https}://${SURVEV_GAME_DOMAIN}}
      GAME_PORTS: ${SURVEV_GAME_PORTS:-9000-9063}
      PROXY_IP_HEADER: X-Forwarded-For
    volumes:
      - lost-games:/app/apps/server/lost_game_data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8001/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-survev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-survev}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  # leaderboard/stats cache (REDIS_URL), nothing to persist
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  bot:
    profiles: [bot]
    build: { <<: *build, target: bot }
    restart: unless-stopped
    depends_on: [api]
    env_file: .env
    environment:
      API_URL: http://api:8000
      PUBLIC_URL: ${SURVEV_SCHEME:-https}://${SURVEV_DOMAIN}

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  lost-games:
